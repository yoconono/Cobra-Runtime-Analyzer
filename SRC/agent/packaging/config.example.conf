# Cobra agent configuration (/etc/cobraagent/cobraagent.conf).
# Format: one "key = value" per line. '#' begins a comment.

# --- Required ---
# Base URL of your CVE Fleet server. MUST be https://
server_url = https://cve.example.com

# One-time / bounded-use enrollment token from the server UI. It is used only
# until the agent obtains its own durable credential (saved under state_dir);
# after that this value is ignored and can be removed.
enrollment_token =
# Alternatively, read the token from a separate file (handy for config mgmt):
# enrollment_token_file = /etc/cobraagent/enrollment.token

# --- Host tags (provisioning) ---
# Labels attached to this host for grouping and filtering in the dashboard.
# Set them here at install/provisioning time: they are sent at enrollment (so the
# host is tagged the moment it registers) and re-sent on every report.
# Format: space- or comma-separated key=value pairs.
tags = env=prod, team=payments, role=web

# --- TLS ---
# Provide a PEM CA bundle only if your server uses a private/internal CA.
# ca_cert_file = /etc/cobraagent/ca.pem
# Testing only. Never enable against a real deployment.
insecure_skip_verify = false

# --- Scheduling ---
# How often to scan. jitter_fraction spreads a large fleet's reports over time
# so they don't all hit the server at once (0.15 = +/-15%).
interval = 6h
jitter_fraction = 0.15

# --- Footprint (the systemd unit also enforces hard cgroup caps) ---
max_procs = 1           # GOMAXPROCS
memory_limit_mib = 90   # Go soft heap limit; keep below the unit's MemoryMax
gc_percent = 40         # GOGC; lower = more aggressive GC, lower RSS
http_timeout = 60s

# Where the agent stores its credential (must be writable by the service user).
state_dir = /var/lib/cobraagent

# --- Language / SBOM scanning ---
# Inventory pip/npm/Go dependencies (not tracked by dpkg/rpm) for OSV matching.
scan_languages = true      # master toggle
scan_go = true             # read Go modules from running binaries (no roots needed)
# Dirs scanned for pip (dist-info) and npm (node_modules). Space/comma separated.
# /home is intentionally not a default; scanning it can be expensive.
scan_roots = /srv /opt /app
scan_max_depth = 8

# --- Minimal-footprint profile ---
# Uncomment the lines below for the lowest CPU/IO/memory use. They override the
# values above (the last matching line wins). Turning off language scanning is
# the single biggest saver; OS-package + running-library detection stays on.
#scan_languages = false     # skip the pip/npm/Go SBOM filesystem walk
#scan_go        = false
#scan_max_depth = 3
#interval       = 24h        # scan once per day instead of every 6h
